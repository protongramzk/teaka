<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeakaLearn - Dashboard Pembelajaran</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined (Google Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <!-- Marked JS -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX JS -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- TeakaLearn Master CSS -->
  <link rel="stylesheet" href="lib/mat.css">
  <link rel="stylesheet" href="lib/quiz.css">

  <style>
    /* Global & Dashboard Custom Styles */
    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-view {
      display: none;
      width: 100%;
    }

    .app-view.active {
      display: block;
      animation: fadeInUp 0.3s var(--smooth-transition, ease);
    }

    .hero {
      text-align: left;
      padding: 28px 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--md-sys-color-on-background);
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 100px;
      width: 100%;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--md-sys-color-surface);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: all 0.2s ease;
    }

    .card:hover {
      background-color: var(--md-sys-color-surface-container);
      border-color: var(--md-sys-color-outline);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--md-sys-color-on-background);
      line-height: 1.3;
    }

    .progress-box {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--radius-l);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-score {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--md-sys-color-primary);
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 600;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chip {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      padding: 6px 12px;
      border-radius: var(--radius-s);
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-accent {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .btn-m3 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      transition: all 0.2s ease;
    }

    .btn-m3:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .btn-m3:active {
      transform: scale(0.96);
    }

    .btn-m3-tonal {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* Google Play Style Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background-color: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      z-index: 100;
      padding: 0 16px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      gap: 4px;
      width: 64px;
    }

    .nav-indicator {
      width: 56px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--md-sys-color-on-surface-variant);
    }

    .nav-item .material-symbols-outlined {
      font-size: 24px;
      transition: all 0.2s ease;
    }

    .nav-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      transition: all 0.2s ease;
    }

    .nav-item.active .nav-indicator {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .nav-item.active .nav-label {
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    /* Loading Spinner */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 600;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="top-app-bar">
    <a href="#home" class="brand-logo" id="top-bar-brand" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
      <span class="material-symbols-outlined" style="font-size: 28px; color: var(--md-sys-color-primary);">school</span>
      <span style="font-weight: 800; font-size: 1.35rem; color: var(--md-sys-color-primary);">TeakaLearn</span>
    </a>
    <a href="#home" class="btn-back" id="top-bar-back" style="display: none; text-decoration: none;">
      <span class="material-symbols-outlined">arrow_back</span>
      Kembali
    </a>
  </header>

  <!-- VIEW 1: DASHBOARD HOME -->
  <div id="view-home" class="app-view active">
    <section class="hero">
      <h1 class="hero-title" id="hero-title">Paket Latihan Soal</h1>
      <p class="hero-subtitle" id="hero-subtitle">Uji kemampuan akademismu dengan kuis interaktif standar TKA & UTBK.</p>
    </section>

    <main class="container">
      <section id="tab-soal" class="tab-content active">
        <div class="card-grid" id="grid-soal"></div>
      </section>

      <section id="tab-materi" class="tab-content">
        <div class="card-grid" id="grid-materi"></div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" onclick="switchTab('soal')">
        <div class="nav-indicator">
          <span class="material-symbols-outlined">quiz</span>
        </div>
        <span class="nav-label">Soal</span>
      </button>

      <button class="nav-item" onclick="switchTab('materi')">
        <div class="nav-indicator">
          <span class="material-symbols-outlined">menu_book</span>
        </div>
        <span class="nav-label">Materi</span>
      </button>
    </nav>
  </div>

  <!-- VIEW 2: QUIZ SPA RUNNER -->
  <div id="view-quiz" class="app-view">
    <main class="container" style="padding-top: 32px;">
      <div id="quiz-mount"></div>
    </main>
  </div>

  <!-- VIEW 3: MATERI SPA VIEWER -->
  <div id="view-materi" class="app-view">
    <main class="materi-container">
      <article class="materi-body" id="materi-mount"></article>
    </main>
  </div>

  <!-- JS Libraries -->
  <script src="lib/render-mat.js"></script>
  <script src="lib/quiz.js"></script>

  <!-- SPA Router & Controller Script -->
  <script>
    /* Manifest Data Soal */
    const dataSoal = [
      {
        id: "mtk-wajib-1",
        title: "Matematika Wajib - Paket 1",
        file: "quiz/mtk-wajib-1.json",
        totalSoal: 10,
        durasi: "20 Menit",
        desc: "Latihan dasar aljabar, trigonometri, komposisi fungsi, dan invers fungsi untuk mengasah logika dasar."
      },
      {
        id: "mtk-wajib-2",
        title: "Matematika Wajib - Paket 2",
        file: "quiz/mtk-wajib-2.json",
        totalSoal: 10,
        durasi: "20 Menit",
        desc: "Pengayaan trigonometri dasar, statistika, peluang, serta barisan dan deret aritmatika/geometri."
      },
      {
        id: "mtk-tl",
        title: "Matematika Tingkat Lanjut",
        file: "quiz/mtk-tl.json",
        totalSoal: 14,
        durasi: "45 Menit",
        desc: "Pembahasan mendalam seputar Limit Fungsi, Turunan Kalkulus, serta soal cerita Matriks, SPLDV & SPLTV."
      }
    ];

    /* Manifest Data Materi */
    const dataMateri = [
      {
        id: "integral",
        title: "Integral Tak Tentu & Tentu",
        file: "materi/integral.md",
        waktuBaca: "8 Menit",
        tag: "Kalkulus",
        desc: "Pelajari konsep antiturunan, rumus dasar integral aljabar, teknik substitusi, hingga perhitungan luas daerah."
      },
      {
        id: "limit",
        title: "Limit Fungsi Aljabar & Trigonometri",
        file: "materi/limit.md",
        waktuBaca: "6 Menit",
        tag: "Kalkulus",
        desc: "Pemahaman intuitif konsep limit, metode pemfaktoran, perkalian sekawan, serta sifat limit trigonometri khusus."
      },
      {
        id: "matriks",
        title: "Matriks & Sistem Persamaan Linear",
        file: "materi/matriks.md",
        waktuBaca: "7 Menit",
        tag: "Aljabar",
        desc: "Operasi penjumlahan & perkalian matriks, determinan, invers 2x2, dan penyelesaian SPLDV/SPLTV dengan matriks."
      }
    ];

    /* Fetch LocalStorage Progress */
    function getQuizHistory() {
      try {
        return JSON.parse(localStorage.getItem('teaka_quiz_history') || '{}');
      } catch (e) {
        return {};
      }
    }

    /* Render Soal Cards */
    function renderSoalCards() {
      const container = document.getElementById('grid-soal');
      const history = getQuizHistory();

      container.innerHTML = dataSoal.map(item => {
        const result = history[item.id];
        let progressHTML = '';

        if (result && result.scores) {
          progressHTML = `
            <div class="progress-box">
              <div>
                <div class="progress-label">Skor TKA Terakhir</div>
                <div class="progress-score">${result.scores.score800} <span style="font-size: 0.75rem; font-weight: normal; color: var(--md-sys-color-on-surface-variant);">/ 800</span></div>
              </div>
              <div style="text-align: right;">
                <div class="progress-label">Benar / Total</div>
                <div style="font-weight: 700; color: var(--md-sys-color-on-surface);">${result.scores.correctCount} / ${result.scores.total}</div>
              </div>
            </div>
          `;
        } else {
          progressHTML = `
            <div class="progress-box">
              <span class="progress-label">Belum Pernah Dikerjakan</span>
              <span class="chip chip-accent" style="font-size: 0.7rem; padding: 2px 8px;">BARU</span>
            </div>
          `;
        }

        return `
          <article class="card">
            <div>
              <h3 class="card-title">${item.title}</h3>
              ${progressHTML}
              <div class="chip-group">
                <span class="chip">
                  <span class="material-symbols-outlined">edit_note</span>
                  ${item.totalSoal} Soal
                </span>
                <span class="chip">
                  <span class="material-symbols-outlined">schedule</span>
                  ${item.durasi}
                </span>
              </div>
              <p class="card-desc">${item.desc}</p>
            </div>
            <div>
              <a href="#quiz/${item.id}" class="btn-m3">
                <span class="material-symbols-outlined">play_arrow</span>
                ${result ? 'Ulangi Kuis' : 'Mulai Kerja'}
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    /* Render Materi Cards */
    function renderMateriCards() {
      const container = document.getElementById('grid-materi');

      container.innerHTML = dataMateri.map(item => `
        <article class="card">
          <div>
            <h3 class="card-title">${item.title}</h3>
            <div class="chip-group">
              <span class="chip">
                <span class="material-symbols-outlined">auto_stories</span>
                ${item.waktuBaca}
              </span>
              <span class="chip chip-accent">
                <span class="material-symbols-outlined">category</span>
                ${item.tag}
              </span>
            </div>
            <p class="card-desc">${item.desc}</p>
          </div>
          <div>
            <a href="#materi/${item.id}" class="btn-m3 btn-m3-tonal">
              <span class="material-symbols-outlined">menu_book</span>
              Baca Materi
            </a>
          </div>
        </article>
      `).join('');
    }

    /* Tab Switcher Logic */
    let activeDashboardTab = 'soal';
    function switchTab(tabName) {
      activeDashboardTab = tabName;
      const navItems = document.querySelectorAll('.nav-item');
      const tabSoal = document.getElementById('tab-soal');
      const tabMateri = document.getElementById('tab-materi');
      const heroTitle = document.getElementById('hero-title');
      const heroSubtitle = document.getElementById('hero-subtitle');

      if (tabName === 'soal') {
        navItems[0].classList.add('active');
        navItems[1].classList.remove('active');
        tabSoal.classList.add('active');
        tabMateri.classList.remove('active');
        heroTitle.innerText = "Paket Latihan Soal";
        heroSubtitle.innerText = "Uji kemampuan akademismu dengan kuis interaktif standar TKA & UTBK.";
      } else {
        navItems[1].classList.add('active');
        navItems[0].classList.remove('active');
        tabMateri.classList.add('active');
        tabSoal.classList.remove('active');
        heroTitle.innerText = "Ringkasan Materi";
        heroSubtitle.innerText = "Pelajari konsep-konsep krusial matematika secara cepat dan ringkas.";
      }
    }

    /* SPA ROUTER */
    async function handleRoute() {
      const hash = window.location.hash || '#home';
      const views = document.querySelectorAll('.app-view');
      views.forEach(v => v.classList.remove('active'));

      const brandLogo = document.getElementById('top-bar-brand');
      const backBtn = document.getElementById('top-bar-back');

      if (hash.startsWith('#quiz/')) {
        const quizId = hash.replace('#quiz/', '');
        const meta = dataSoal.find(q => q.id === quizId);

        brandLogo.style.display = 'none';
        backBtn.style.display = 'flex';
        document.getElementById('view-quiz').classList.add('active');

        const mount = document.getElementById('quiz-mount');
        mount.innerHTML = '<div class="loading-state">Memuat Soal Kuis...</div>';

        if (!meta) {
          mount.innerHTML = '<div class="loading-state">Kuis tidak ditemukan.</div>';
          return;
        }

        try {
          const res = await fetch(meta.file);
          const questions = await res.json();
          new TeakaQuiz({
            quizId: quizId,
            containerId: 'quiz-mount',
            questions: questions,
            onComplete: () => renderSoalCards()
          });
        } catch (err) {
          mount.innerHTML = `<div class="loading-state">Gagal memuat kuis: ${err.message}</div>`;
        }

      } else if (hash.startsWith('#materi/')) {
        const materiId = hash.replace('#materi/', '');
        const meta = dataMateri.find(m => m.id === materiId);

        brandLogo.style.display = 'none';
        backBtn.style.display = 'flex';
        document.getElementById('view-materi').classList.add('active');

        const mount = document.getElementById('materi-mount');
        mount.innerHTML = '<div class="loading-state">Memuat Materi...</div>';

        if (!meta) {
          mount.innerHTML = '<div class="loading-state">Materi tidak ditemukan.</div>';
          return;
        }

        try {
          const res = await fetch(meta.file);
          const mdText = await res.text();
          mount.innerHTML = window.renderMarkdownAndLatex(mdText);
          window.scrollTo(0, 0);
        } catch (err) {
          mount.innerHTML = `<div class="loading-state">Gagal memuat materi: ${err.message}</div>`;
        }

      } else {
        // Default: #home
        brandLogo.style.display = 'flex';
        backBtn.style.display = 'none';
        document.getElementById('view-home').classList.add('active');
        renderSoalCards();
        renderMateriCards();
        switchTab(activeDashboardTab);
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);
  </script>

</body>
</html>
