<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeakaLearn - Dashboard Pembelajaran</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined (Google Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

  <style>
    /* =========================================================
       1. VARIABLES & THEMING (Material You M3 Dark Orange)
       ========================================================= */
    :root {
      /* Palette Dark Mode M3 - Vibrant Orange & Warm Tones */
      --md-sys-color-background: #19120c;
      --md-sys-color-surface: #261d15;
      --md-sys-color-surface-container: #33271d;
      --md-sys-color-surface-container-high: #403226;
      --md-sys-color-surface-container-highest: #4d3d30;
      
      --md-sys-color-primary: #ffb77c;
      --md-sys-color-on-primary: #4d2600;
      --md-sys-color-primary-container: #6d3900;
      --md-sys-color-on-primary-container: #ffdcbe;
      
      --md-sys-color-secondary-container: #574236;
      --md-sys-color-on-secondary-container: #e6beac;

      --md-sys-color-on-background: #f0dfd6;
      --md-sys-color-on-surface: #d7c2b5;
      --md-sys-color-on-surface-variant: #9f8d83;
      --md-sys-color-outline: #52443b;
      --md-sys-color-outline-variant: #3a2e26;

      /* Material Shape Tokens */
      --radius-s: 8px;
      --radius-m: 12px;
      --radius-l: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --fast-transition: all 0.2s var(--spring-bounce);
      --smooth-transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      user-select: none;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px; /* Space for Bottom Navigation */
    }

    /* Helper Class Icon Material */
    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle;
    }

    /* =========================================================
       2. TOP APP BAR
       ========================================================= */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(25, 18, 12, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .brand-logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--md-sys-color-primary);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* =========================================================
       3. HERO / PAGE HEADER
       ========================================================= */
    .hero {
      text-align: left;
      padding: 28px 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--md-sys-color-on-background);
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    /* =========================================================
       4. CARDS & GRID CONTAINER
       ========================================================= */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 40px;
      width: 100%;
    }

    .tab-content {
      display: none;
      animation: fadeInUp 0.3s var(--smooth-transition);
    }

    .tab-content.active {
      display: block;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Material You Expressive Card */
    .card {
      background-color: var(--md-sys-color-surface);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: var(--fast-transition);
    }

    .card:hover {
      background-color: var(--md-sys-color-surface-container);
      border-color: var(--md-sys-color-outline);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--md-sys-color-on-background);
      line-height: 1.3;
    }

    /* Progress & Score Container */
    .progress-box {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--radius-l);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-score {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--md-sys-color-primary);
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 600;
    }

    /* M3 Chips */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chip {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      padding: 6px 12px;
      border-radius: var(--radius-s);
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-accent {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    /* M3 Filled Button */
    .btn-m3 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      transition: var(--fast-transition);
    }

    .btn-m3:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .btn-m3:active {
      transform: scale(0.96);
    }

    .btn-m3-tonal {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* =========================================================
       5. GOOGLE PLAY STYLE BOTTOM NAVIGATION
       ========================================================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background-color: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      z-index: 100;
      padding: 0 16px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      gap: 4px;
      width: 64px;
    }

    /* M3 Pill Indicator */
    .nav-indicator {
      width: 56px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--fast-transition);
      color: var(--md-sys-color-on-surface-variant);
    }

    .nav-item .material-symbols-outlined {
      font-size: 24px;
      transition: var(--fast-transition);
    }

    .nav-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      transition: var(--fast-transition);
    }

    /* Active State (Google Play Style) */
    .nav-item.active .nav-indicator {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .nav-item.active .nav-label {
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    .nav-item:active .nav-indicator {
      transform: scale(0.9);
    }

    /* Keyframes */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="top-app-bar">
    <div class="brand-logo">
      <span class="material-symbols-outlined" style="font-size: 28px;">school</span>
      TeakaLearn
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1 class="hero-title" id="hero-title">Paket Latihan Soal</h1>
    <p class="hero-subtitle" id="hero-subtitle">Uji kemampuan akademismu dengan kuis interaktif standar TKA & UTBK.</p>
  </section>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="container">
    
    <!-- TAB 1: SOAL -->
    <section id="tab-soal" class="tab-content active">
      <div class="card-grid" id="grid-soal"></div>
    </section>

    <!-- TAB 2: MATERI -->
    <section id="tab-materi" class="tab-content">
      <div class="card-grid" id="grid-materi"></div>
    </section>

  </main>

  <!-- GOOGLE PLAY BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('soal')">
      <div class="nav-indicator">
        <span class="material-symbols-outlined">quiz</span>
      </div>
      <span class="nav-label">Soal</span>
    </button>
    
    <button class="nav-item" onclick="switchTab('materi')">
      <div class="nav-indicator">
        <span class="material-symbols-outlined">menu_book</span>
      </div>
      <span class="nav-label">Materi</span>
    </button>
  </nav>

  <!-- SCRIPT LOGIC -->
  <script>
    /* Data Soal JSON */
    const dataSoal = [
      {
        id: "mtk-wajib-1",
        title: "Matematika Wajib - Paket 1",
        path: "quiz/mtk-wajib-1.html",
        totalSoal: 15,
        durasi: "30 Menit",
        desc: "Latihan dasar aljabar, persamaan garis, fungsi kuadrat, dan geometri umum untuk mengasah logika dasar."
      },
      {
        id: "mtk-wajib-2",
        title: "Matematika Wajib - Paket 2",
        path: "quiz/mtk-wajib-2.html",
        totalSoal: 15,
        durasi: "30 Menit",
        desc: "Pengayaan trigonometri dasar, statistika, peluang, serta barisan dan deret aritmatika/geometri."
      },
      {
        id: "mtk-tl-1",
        title: "Matematika Tingkat Lanjut",
        path: "quiz/mtk-tl.html",
        totalSoal: 14,
        durasi: "45 Menit",
        desc: "Pembahasan mendalam seputar Limit Fungsi, Turunan Kalkulus, serta soal cerita Matriks, SPLDV & SPLTV."
      }
    ];

    /* Data Materi JSON */
    const dataMateri = [
      {
        id: "materi-integral",
        title: "Integral Tak Tentu & Tentu",
        path: "materi/integral.html",
        waktuBaca: "8 Menit",
        tag: "Kalkulus",
        desc: "Pelajari konsep antiturunan, rumus dasar integral aljabar, teknik substitusi, hingga perhitungan luas daerah."
      },
      {
        id: "materi-limit",
        title: "Limit Fungsi Aljabar & Trigonometri",
        path: "materi/limit.html",
        waktuBaca: "6 Menit",
        tag: "Kalkulus",
        desc: "Pemahaman intuitif konsep limit, metode pemfaktoran, perkalian sekawan, serta sifat limit trigonometri khusus."
      },
      {
        id: "materi-matriks",
        title: "Matriks & Sistem Persamaan Linear",
        path: "materi/matriks.html",
        waktuBaca: "7 Menit",
        tag: "Aljabar",
        desc: "Operasi penjumlahan & perkalian matriks, determinan, invers 2x2, dan penyelesaian SPLDV/SPLTV dengan matriks."
      }
    ];

    /* Fetch LocalStorage Progress */
    function getQuizHistory() {
      try {
        return JSON.parse(localStorage.getItem('teaka_quiz_history') || '{}');
      } catch (e) {
        return {};
      }
    }

    /* Render Soal Cards */
    function renderSoalCards() {
      const container = document.getElementById('grid-soal');
      const history = getQuizHistory();

      container.innerHTML = dataSoal.map(item => {
        const result = history[item.id];
        let progressHTML = '';

        if (result && result.scores) {
          progressHTML = `
            <div class="progress-box">
              <div>
                <div class="progress-label">Skor TKA Terakhir</div>
                <div class="progress-score">${result.scores.score800} <span style="font-size: 0.75rem; font-weight: normal; color: var(--md-sys-color-on-surface-variant);">/ 800</span></div>
              </div>
              <div style="text-align: right;">
                <div class="progress-label">Benar / Total</div>
                <div style="font-weight: 700; color: var(--md-sys-color-on-surface);">${result.scores.correctCount} / ${result.scores.total}</div>
              </div>
            </div>
          `;
        } else {
          progressHTML = `
            <div class="progress-box">
              <span class="progress-label">Belum Pernah Dikerjakan</span>
              <span class="chip chip-accent" style="font-size: 0.7rem; padding: 2px 8px;">BARU</span>
            </div>
          `;
        }

        return `
          <article class="card">
            <div>
              <h3 class="card-title">${item.title}</h3>
              ${progressHTML}
              <div class="chip-group">
                <span class="chip">
                  <span class="material-symbols-outlined">edit_note</span>
                  ${item.totalSoal} Soal
                </span>
                <span class="chip">
                  <span class="material-symbols-outlined">schedule</span>
                  ${item.durasi}
                </span>
              </div>
              <p class="card-desc">${item.desc}</p>
            </div>
            <div>
              <a href="${item.path}" class="btn-m3">
                <span class="material-symbols-outlined">play_arrow</span>
                ${result ? 'Ulangi Kuis' : 'Mulai Kerja'}
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    /* Render Materi Cards */
    function renderMateriCards() {
      const container = document.getElementById('grid-materi');

      container.innerHTML = dataMateri.map(item => `
        <article class="card">
          <div>
            <h3 class="card-title">${item.title}</h3>
            <div class="chip-group">
              <span class="chip">
                <span class="material-symbols-outlined">auto_stories</span>
                ${item.waktuBaca}
              </span>
              <span class="chip chip-accent">
                <span class="material-symbols-outlined">category</span>
                ${item.tag}
              </span>
            </div>
            <p class="card-desc">${item.desc}</p>
          </div>
          <div>
            <a href="${item.path}" class="btn-m3 btn-m3-tonal">
              <span class="material-symbols-outlined">menu_book</span>
              Baca Materi
            </a>
          </div>
        </article>
      `).join('');
    }

    /* Tab Switcher Logic */
    function switchTab(tabName) {
      const navItems = document.querySelectorAll('.nav-item');
      const tabSoal = document.getElementById('tab-soal');
      const tabMateri = document.getElementById('tab-materi');
      const heroTitle = document.getElementById('hero-title');
      const heroSubtitle = document.getElementById('hero-subtitle');

      if (tabName === 'soal') {
        navItems[0].classList.add('active');
        navItems[1].classList.remove('active');
        tabSoal.classList.add('active');
        tabMateri.classList.remove('active');
        heroTitle.innerText = "Paket Latihan Soal";
        heroSubtitle.innerText = "Uji kemampuan akademismu dengan kuis interaktif standar TKA & UTBK.";
      } else {
        navItems[1].classList.add('active');
        navItems[0].classList.remove('active');
        tabMateri.classList.add('active');
        tabSoal.classList.remove('active');
        heroTitle.innerText = "Ringkasan Materi";
        heroSubtitle.innerText = "Pelajari konsep-konsep krusial matematika secara cepat dan ringkas.";
      }
    }

    // Init Render
    renderSoalCards();
    renderMateriCards();
  </script>

</body>
</html>
