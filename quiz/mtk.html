<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Soal Cerita Matematika - TeakaLearn</title>
  
  <!-- Font Google Sans Flex -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 1. Parser Markdown (Marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- 2. Parser LaTeX (MathJax v3) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --md-sys-color-background: #0f1417;
      --md-sys-color-surface-container: #1b2024;
      --md-sys-color-surface-variant: #2d343a;
      --md-sys-color-primary: #a1c8f6;
      --md-sys-color-on-primary: #00325b;
      --md-sys-color-primary-container: #1b4873;
      --md-sys-color-on-primary-container: #d1e4ff;
      --md-sys-color-on-background: #e1e2e5;
      --md-sys-color-on-surface-variant: #8c9299;
      --md-sys-color-outline: #3d4752;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans Flex', sans-serif;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-bottom: 30px;
      text-align: center;
    }

    /* Container untuk Mount Quiz Engine */
    #quiz-app {
      width: 100%;
      max-width: 760px;
    }
  </style>
</head>
<body>

  <h1 class="header-title">Latihan Soal Cerita Matematika TKA</h1>

  <!-- Mount Point Engine Quiz -->
  <div id="quiz-app"></div>

  <!-- Inisialisasi Quiz via ESM Module -->
  <script type="module">
    import { TeakaQuiz } from '/lib/quiz.js';

    // Array JSON Soal Cerita Matematika (Markdown + LaTeX)
    const questions = [
      {
        question: `
Sebuah perusahaan teknologi lokal sedang merancang sistem **alokasi server optik**. 

Laju pertumbuhan lalu lintas data per detik dirumuskan oleh fungsi kontinu:
$$f(t) = 4t^3 - 6t^2 + 10$$

Jika kapasitas penyimpanan data total pada selang waktu $t = 1$ hingga $t = 3$ detik dinyatakan oleh nilai integral tentu:
$$V = \\int_{1}^{3} (4t^3 - 6t^2 + 10) \\, dt$$

Berapakah total **kapasitas volume data** ($V$) yang diproses oleh server tersebut?
`,
        type: "single", // Pilihan Ganda Biasa
        answer: [
          "$V = 36 \\text{ Terabyte}$",
          "$V = 48 \\text{ Terabyte}$",
          "$V = 52 \\text{ Terabyte}$",
          "$V = 60 \\text{ Terabyte}$"
        ],
        trueAnswer: 2 // Jawabannya 52 Terabyte (Index 2)
      },
      {
        question: `
Seorang pengembang game indie sedang memodelkan laju kecepatan karakter saat melompat di udara. 

Posisinya $h(t)$ dalam meter terhadap waktu $t$ detik mengikuti persamaan quadratic:
$$h(t) = -5t^2 + 20t + 2$$

Pilihlah **semua** pernyataan di bawah ini yang **benar** terkait pergerakan karakter tersebut! *(Pilih lebih dari satu)*
`,
        type: "multiple", // Pilihan Ganda Kompleks
        answer: [
          "Ketinggian maksimum yang dicapai karakter adalah $22 \\text{ meter}$.",
          "Waktu yang dibutuhkan untuk mencapai titik tertinggi adalah $t = 2 \\text{ detik}$.",
          "Kecepatan awal karakter saat $t = 0$ adalah $20 \\text{ m/s}$.",
          "Karakter mencapai tanah kembali saat $t = 5 \\text{ detik}$ persis."
        ],
        trueAnswer: [0, 1, 2] // Index 0, 1, dan 2 benar
      }
    ];

    // Instantiate Quiz Engine
    new TeakaQuiz({
      containerId: 'quiz-app',
      questions: questions,
      onComplete: (result) => {
        console.log("Quiz Selesai! Hasil:", result);
      }
    });
  </script>

</body>
</html>
